[package]
name = "video-use"
version = "0.1.0"
edition = "2021"
description = "A fast, production-grade Rust port of video-use — conversation-driven video editor toolkit"
license = "MIT"
authors = ["Brandon Hubbard"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
tempfile = "3"
regex = "1"
num-rational = "0.4"
num-traits = "0.2"
hound = "3.5"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
ab_glyph = "0.2"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
