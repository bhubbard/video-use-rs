name: CI & Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Test & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies (ffmpeg & ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run unit and integration tests
        run: cargo test --all-targets --verbose

      - name: Generate Code Coverage (LCOV & HTML)
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --html --output-dir target/llvm-cov/html

      - name: Publish Coverage Summary to GitHub Step Summary
        run: |
          echo "### Code Coverage Report 📊" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Coverage Report as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: target/llvm-cov/html

      - name: Upload LCOV File as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: lcov.info
